# bandit_v1 run_race: gradient-analysis retention note (owner request) --
# nothing pull.py writes (checkpoints at every save interval, per-pull
# demo_ids, paired training seeds) is ever deleted; every pull row also
# carries a training_artifacts_json field recording exactly where each
# of these landed on disk, for a future per-demo gradient/influence pass.
